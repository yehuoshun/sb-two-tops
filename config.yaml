# sb-two-tops 配置

game:
  # 游戏窗口标题（支持模糊匹配）
  window_title: "二重螺旋"
  # 游戏分辨率
  width: 1920
  height: 1080

dungeon:
  # 目标副本：探险 / 皎皎币 / 勘探 / 无尽
  target: "探险"
  # 是否循环刷
  loop: true
  # 最大次数（0 = 无限）
  max_runs: 0

combat:
  # 进本后执行的连招/宏，q=大招，支持 eee,qaq 格式
  combo: "q"
  # 大招释放间隔（秒）
  combo_interval: 2.0

input:
  # 输入方式：sendinput / pyautogui
  method: "sendinput"

templates:
  # 模板匹配置信度阈值
  threshold: 0.8
  # 模板目录
  dir: "./templates"

packaging:
  # 编译后 exe 名称（伪装成 Windows 系统进程）
  exe_name: "sihost.exe"